services:
  # Servicio Core API Thumbi (Go + Gin)
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: thumbi-api
    ports:
      - "${PORT:-8080}:8080"
    env_file:
      - path: .env
        required: false
    environment:
      - PORT=${PORT:-8080}
      - ENV=${ENV:-development}
      - DATABASE_URL=postgres://${POSTGRES_USER:-thumbi}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-thumbi_carpooling}?sslmode=disable
      - DB_MAX_CONNS=${DB_MAX_CONNS:-20}
      - DB_MIN_CONNS=${DB_MIN_CONNS:-5}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ISSUER=${JWT_ISSUER:-thumbi-auth-service}
      - SESSION_TTL=${SESSION_TTL:-20m}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - APPLE_CLIENT_ID=${APPLE_CLIENT_ID}
      - LIVENESS_THRESHOLD=${LIVENESS_THRESHOLD:-0.85}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}
      - OSRM_BASE_URL=${OSRM_BASE_URL:-http://router.project-osrm.org}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - thumbi-network
    restart: unless-stopped

  # Base de Datos Relacional PostgreSQL con PostGIS
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: thumbi-postgres
    ports:
      - "5432:5432"
    env_file:
      - path: .env
        required: false
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-thumbi}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-thumbi_carpooling}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-thumbi} -d ${POSTGRES_DB:-thumbi_carpooling}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - thumbi-network
    restart: unless-stopped

  # Cache en Memoria Redis para invalidación rápida de tokens y rate limiting
  redis:
    image: redis:7-alpine
    container_name: thumbi-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - thumbi-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  thumbi-network:
    driver: bridge
