services:
  # Servicio Core API Thumbi (Go + Gin)
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: thumbi-api
    ports:
      - "${PORT:-8080}:8080"
    env_file:
      - path: .env
        required: true
    environment:
      - PORT=${PORT:-8080}
      - ENV=${ENV:-development}
      - DATABASE_URL=postgres://${POSTGRES_USER:-thumbi}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-thumbi_carpooling}?sslmode=disable
      - DB_MAX_CONNS=${DB_MAX_CONNS:-20}
      - DB_MIN_CONNS=${DB_MIN_CONNS:-5}
      - RATE_LIMIT_STORE=${RATE_LIMIT_STORE:-memory}
      - SESSION_TTL=${SESSION_TTL:-20m}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - APPLE_CLIENT_ID=${APPLE_CLIENT_ID:-}
      - LIVENESS_THRESHOLD=${LIVENESS_THRESHOLD:-0.85}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:?Set WEBHOOK_SECRET in .env}
      - OSRM_BASE_URL=${OSRM_BASE_URL:-https://router.project-osrm.org}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      - APP_URL=${APP_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - thumbi-network
    restart: unless-stopped

  # Base de Datos Relacional PostgreSQL con PostGIS (sesiones, rate limiting opcional y datos transaccionales)
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: thumbi-postgres
    ports:
      - "127.0.0.1:5432:5432"
    env_file:
      - path: .env
        required: true
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-thumbi}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=${POSTGRES_DB:-thumbi_carpooling}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-thumbi} -d ${POSTGRES_DB:-thumbi_carpooling}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - thumbi-network
    restart: unless-stopped

  # Ejecutor explícito de migraciones DDL (.up.sql) antes de levantar la API
  migrate:
    image: migrate/migrate:v4.17.1
    container_name: thumbi-migrate
    env_file:
      - path: .env
        required: true
    volumes:
      - ./migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database
      - postgres://${POSTGRES_USER:-thumbi}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-thumbi_carpooling}?sslmode=disable
      - up
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - thumbi-network
    restart: "on-failure:5"

volumes:
  postgres_data:
    driver: local

networks:
  thumbi-network:
    driver: bridge
