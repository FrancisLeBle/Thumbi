name: Thumbi CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.24'
  CGO_ENABLED: '0'

jobs:
  # 1. Job de Linting y Análisis Estático de Código
  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify Go Modules
        run: |
          go mod verify
          go mod tidy --diff || true

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

  # 2. Job de Pruebas Unitarias y de Integración con Cobertura
  test:
    name: Automated Tests & Coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_USER: thumbi
          POSTGRES_PASSWORD: thumbi_secret
          POSTGRES_DB: thumbi_carpooling
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U thumbi -d thumbi_carpooling"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download Go Dependencies
        run: go mod download

      - name: Run Tests with Coverage (go test -v -cover ./...)
        env:
          DATABASE_URL: postgres://thumbi:thumbi_secret@localhost:5432/thumbi_carpooling?sslmode=disable
          JWT_SECRET: thumbi-super-secure-production-ready-jwt-secret-key-32-chars
          JWT_ISSUER: thumbi-auth-service
          SESSION_TTL: 20m
        run: |
          go test -v -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Calculate and Verify Minimum Test Coverage (>= 80%)
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep "total:" | awk '{print substr($3, 1, length($3)-1)}')
          echo "Total Coverage: ${COVERAGE}%"
          # Validar que la cobertura total sea adecuada para producción
          awk -v cov="$COVERAGE" 'BEGIN {
            if (cov < 80.0) {
              print "WARNING: Test coverage (" cov "%) is below the 80% target."
            } else {
              print "SUCCESS: Test coverage (" cov "%) meets quality standards."
            }
          }'

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 7

  # 3. Job de Validación de Compilación del Binario y Contenedor Docker
  build:
    name: Binary & Docker Build Validation
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Validate Binary Compilation
        run: |
          mkdir -p bin
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -v -ldflags="-w -s" \
            -o ./bin/thumbi-api \
            ./cmd/api/main.go
          ls -lh ./bin/thumbi-api
          file ./bin/thumbi-api

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: thumbi-api:latest,thumbi-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
