name: Thumbi CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.25'
  CGO_ENABLED: '0'

jobs:
  # 0. Job de Auditoría de Secretos y Seguridad Estática
  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code (Full History)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 1. Job de Linting, Análisis Estático y Vulnerabilidades
  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify Go Modules
        run: |
          go mod verify
          go mod tidy --diff || true

      - name: Run go vet
        run: go vet ./...

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

  # 2. Job de Pruebas Unitarias y de Integración con Credenciales Efímeras/Secretos CI
  test:
    name: Automated Tests & Coverage
    needs: [secret-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download Go Dependencies
        run: go mod download

      - name: Generate Ephemeral Per-Run Secrets & Start PostGIS Test Database
        id: ephemeral
        run: |
          # Generar credenciales aleatorias por ejecución (sin contraseñas literales en YAML)
          # Si CI_POSTGRES_PASSWORD está definido en Repository Secrets, se usa; si no, se genera uno efímero.
          PG_PASS="${CI_POSTGRES_PASSWORD:-$(openssl rand -hex 24)}"
          WEBHOOK_SEC="$(openssl rand -hex 32)"
          echo "::add-mask::${PG_PASS}"
          echo "::add-mask::${WEBHOOK_SEC}"

          PG_USER="thumbi_ci"
          PG_DB="thumbi_carpooling_test"

          docker run -d --name ci-postgres \
            -e POSTGRES_USER="${PG_USER}" \
            -e POSTGRES_PASSWORD="${PG_PASS}" \
            -e POSTGRES_DB="${PG_DB}" \
            -p 5432:5432 \
            postgis/postgis:16-3.4-alpine

          echo "Waiting for PostGIS readiness..."
          for i in $(seq 1 30); do
            if docker exec ci-postgres pg_isready -U "${PG_USER}" -d "${PG_DB}" >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          echo "ENV=development" >> "$GITHUB_ENV"
          echo "DATABASE_URL=postgres://${PG_USER}:${PG_PASS}@localhost:5432/${PG_DB}?sslmode=disable" >> "$GITHUB_ENV"
          echo "WEBHOOK_SECRET=${WEBHOOK_SEC}" >> "$GITHUB_ENV"
          echo "RATE_LIMIT_STORE=memory" >> "$GITHUB_ENV"
          echo "SESSION_TTL=20m" >> "$GITHUB_ENV"
        env:
          CI_POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}

      - name: Run Tests with Coverage (go test -v -race -cover ./...)
        run: |
          go test -v -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Stop Ephemeral PostGIS Container
        if: always()
        run: docker rm -f ci-postgres || true

      - name: Calculate and Verify Minimum Test Coverage (>= 80%)
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep "total:" | awk '{print substr($3, 1, length($3)-1)}')
          echo "Total Coverage: ${COVERAGE}%"
          awk -v cov="$COVERAGE" 'BEGIN {
            if (cov < 80.0) {
              print "WARNING: Test coverage (" cov "%) is below the 80% target."
            } else {
              print "SUCCESS: Test coverage (" cov "%) meets quality standards."
            }
          }'

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 7

  # 3. Job de Validación de Compilación del Binario y Contenedor Docker (sin secretos en capas)
  build:
    name: Binary & Docker Build Validation
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Validate Binary Compilation
        run: |
          mkdir -p bin
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -v -ldflags="-w -s" \
            -o ./bin/thumbi-api \
            ./cmd/api/main.go
          ls -lh ./bin/thumbi-api
          file ./bin/thumbi-api

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: thumbi-api:latest,thumbi-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
